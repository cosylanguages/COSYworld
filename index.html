<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEARS TO FATHOM: Episode COSY Town 📼</title>
    <meta name="description" content="An episodic analog horror language immersion experience. Explore COSY Town, survive realistic social scenarios, and master 14 languages in Fears to Fathom style.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📼</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Standalone CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/ui.css">
</head>
<body class="game-standalone">
    <header class="cw-nav">
      <a class="cw-logo" href="index.html">
        <span>📼</span> FEARS TO FATHOM: COSY Town
      </a>
      <div class="cw-nav-links">
        <a href="https://cosylanguages.github.io/COSYlanguages/index.html" target="_blank" rel="noopener">Episode Archive ↗</a>
        <a href="docs/contributing.html">Contribute 🤝</a>
      </div>
    </header>

    <main class="cw-container">
      <!-- Topbar Stats & Controls -->
      <div class="cw-topbar-card">
        <div class="cw-player-stats">
          <div class="cw-stat-badge">🏛️ Citizen Level: <span id="cw-citizen-lvl">1 (Novice)</span></div>
          <div class="cw-stat-badge">⭐ XP: <span id="cw-xp-num">0</span></div>
          <div class="cw-xp-bar-wrap">
            <div class="cw-xp-track">
              <div class="cw-xp-fill" id="cw-xp-fill"></div>
            </div>
          </div>
          <div class="cw-stat-badge paranoia">👁️ Paranoia: <span id="cw-paranoia-num">12%</span></div>
          <div class="cw-xp-bar-wrap">
            <div class="cw-xp-track">
              <div class="cw-paranoia-fill" id="cw-paranoia-fill" style="width: 12%;"></div>
            </div>
          </div>
        </div>

        <div class="cw-controls">
          <button class="cw-btn-toggle" type="button" onclick="COSY_WORLD.openWorldMap()">🗺️ World Map</button>
          <button class="cw-btn-toggle" type="button" onclick="COSY_WORLD.openMinigameLauncher()">🎮 Minigames</button>
          <button class="cw-btn-toggle" type="button" onclick="COSY_WORLD.toggleGuidePointers()">👉 Guide Pointers</button>
          <button class="cw-btn-toggle" type="button" onclick="COSY_WORLD.toggleTranslations()">🌐 Translation Mode</button>
          <button class="cw-btn-toggle" type="button" onclick="COSY_WORLD.toggleVhsShader()">📹 VHS Overlay</button>

          <label for="cw-lang-sel" style="font-size:0.85rem; font-weight:700;">Target Language:</label>
          <select class="cw-sel" id="cw-lang-sel" onchange="COSY_WORLD.changeLanguage(this.value)">
            <!-- Generated dynamically -->
          </select>

          <label for="cw-sound-sel" style="font-size:0.85rem; font-weight:700;">Atmosphere 🎧:</label>
          <select class="cw-sel" id="cw-sound-sel" onchange="COSY_WORLD.playAmbience(this.value)">
            <option value="none">Mute Ambient</option>
            <option value="drone" selected>Eerie Drone 📼</option>
            <option value="rain">Rainstorm 🌧️</option>
            <option value="cafe">Coffee Shop ☕</option>
            <option value="nature">Night Breeze 🍃</option>
          </select>
        </div>
      </div>

      <!-- Main Game Layout -->
      <div class="cw-viewport-layout">

        <!-- Left Column: Open-World Viewport with Fears to Fathom VHS Overlay -->
        <div class="cw-stage-card">
          <div class="cw-stage-header">
            <div class="cw-district-title" id="cw-location-title">🛋️ Apartment Living Room</div>
            <div style="font-size:0.85rem; font-weight:700; color:var(--text-muted);" id="cw-district-name">Residential District</div>
          </div>

          <!-- SVG Canvas Stage Wrapper with Camcorder OSD Overlay -->
          <div class="vhs-viewport-wrapper" id="cw-vhs-wrapper">
            <div class="vhs-osd-overlay" id="cw-vhs-osd">
              <div class="vhs-osd-top">
                <div class="vhs-osd-rec">
                  <div class="vhs-rec-dot"></div>
                  <span>REC</span>
                </div>
                <div>PLAY ▶</div>
                <div id="vhs-osd-counter">00:04:12</div>
              </div>
              <div class="vhs-osd-bottom">
                <div class="vhs-osd-time" id="vhs-osd-time-display">OCT 14, 1998 — 10:42:15 PM</div>
                <div>BAT [███ ]</div>
              </div>
            </div>

            <!-- SVG Canvas World Stage -->
            <svg class="cw-svg-view" id="cw-world-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
              <!-- SVG elements generated dynamically in engine -->
            </svg>
          </div>
        </div>

        <!-- Right Column: HUD Sidebar (Quests, Encyclopedia, Grammar Tree, NPCs) -->
        <div class="cw-hud-card">
          <div class="cw-hud-nav">
            <button class="cw-hud-btn active" type="button" onclick="COSY_WORLD.switchTab('quests', this)">Quests 📜</button>
            <button class="cw-hud-btn" type="button" onclick="COSY_WORLD.switchTab('vocab', this)">Encyclopedia 📚</button>
            <button class="cw-hud-btn" type="button" onclick="COSY_WORLD.switchTab('grammar', this)">Grammar 🌳</button>
            <button class="cw-hud-btn" type="button" onclick="COSY_WORLD.switchTab('npcs', this)">NPCs 💬</button>
          </div>

          <div class="cw-hud-content" id="cw-hud-tab-body">
            <!-- Tab contents loaded dynamically -->
          </div>
        </div>

      </div>
    </main>

    <!-- Modal for Object Inspector & Dialogue -->
    <div class="cw-modal-overlay" id="cw-modal">
      <div class="cw-modal-card" id="cw-modal-card">
        <button class="cw-modal-close" type="button" onclick="COSY_WORLD.closeModal()">✕</button>
        <div id="cw-modal-body"></div>
      </div>
    </div>

    <!-- COSY World ES Module Entry Point -->
    <script type="module" src="js/main.js"></script>

    <div id="toast" style="position: fixed; bottom: 2rem; right: 2rem; background: var(--text-main); color: #fff; padding: 12px 24px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 3000; font-size: .85rem; font-weight: 500;"></div>
</body>
</html>
