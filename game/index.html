<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSY World Canvas Game View</title>
  <link rel="stylesheet" href="/shared/styles/style.css">
  <link rel="stylesheet" href="/css/cosy-world.css">
</head>
<body>
  <header class="cosy-header">
    <a href="/index.html" class="brand-logo">
      <img src="/shared/assets/icon-world.svg" alt="COSY World Logo">
      <span>COSY World</span>
    </a>
    <nav class="main-nav">
      <a href="/game/town-map/index.html">Town Map</a>
      <a href="/progress/index.html">Progress</a>
    </nav>
  </header>

  <div class="hud-bar">
    <div class="hud-player">
      <img id="hud-avatar" src="/shared/assets/james-york.svg" class="hud-avatar" alt="Character">
      <div>
        <div id="hud-name" style="font-weight: bold; color: var(--color-text-bright);">Player</div>
        <div style="font-size: 0.85rem; color: var(--color-text-muted);">Level <span id="hud-level">1</span></div>
      </div>
    </div>
    <div>Location: <strong id="hud-location">Town Square</strong></div>
  </div>

  <main class="game-viewport">
    <svg width="100%" height="100%" viewBox="0 0 800 600" style="background: #111827;">
      <rect x="100" y="100" width="600" height="400" fill="#1f2937" rx="12" />
      <text x="400" y="300" fill="#9ca3af" text-anchor="middle" font-size="20">Interactive Isometric Canvas View</text>
      <circle cx="400" cy="350" r="16" fill="#3b82f6" />
      <text x="400" y="380" fill="#ffffff" text-anchor="middle" font-size="14">You are here</text>
    </svg>

    <div class="dialogue-overlay">
      <div class="speaker-name">Guide NPC</div>
      <p>Welcome to COSY World! Explore districts, speak to locals, and complete quests to master new languages.</p>
      <a href="/game/town-map/index.html" class="btn-primary" style="font-size: 0.9rem; padding: 0.5rem 1rem;">Open Town Map</a>
    </div>
  </main>
</body>
</html>
