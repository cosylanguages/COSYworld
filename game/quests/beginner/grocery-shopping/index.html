<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Shopping - COSY World</title>
  <link rel="stylesheet" href="/shared/styles/style.css">
  <link rel="stylesheet" href="/css/cosy-world.css">
</head>
<body>
  <header class="cosy-header">
    <a href="/index.html" class="brand-logo">
      <img src="/shared/assets/icon-world.svg" alt="Logo">
      <span>COSY World</span>
    </a>
    <nav class="main-nav">
      <a href="/game/town-map/index.html">Town Map</a>
      <a href="/progress/index.html">Progress</a>
    </nav>
  </header>

  <main style="max-width: 800px; margin: 2rem auto; padding: 1rem;">
    <div style="background: var(--color-surface); padding: 2rem; border-radius: var(--radius-md); border: 1px solid var(--color-border);">
      <span class="trait-tag">Beginner Quest 2</span>
      <h1 style="color: var(--color-text-bright); font-family: var(--font-family-heading);">Grocery Shopping</h1>
      <p>Visit the Commercial District market, interact with Ella Bronx at the bakery, and acquire fresh ingredients.</p>

      <hr style="border-color: var(--color-border); margin: 1.5rem 0;">

      <h3>Objectives</h3>
      <ul>
        <li><input type="checkbox" id="obj1"> <label for="obj1">Visit the Market Stall in the Commercial District</label></li>
        <li><input type="checkbox" id="obj2"> <label for="obj2">Order "Pain" (Bread) or "Pomme" (Apple) from Ella Bronx</label></li>
      </ul>

      <a href="/game/town-map/index.html" class="btn-primary" style="margin-top: 1rem;">Return to Map</a>
    </div>
  </main>
</body>
</html>
